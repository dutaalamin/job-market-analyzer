<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Skill trends · Job Market Analyzer</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap');
  :root{--bg:#0c0b09;--ink:#f2efe9;--muted:#8b857c;--faint:#5f5a51;
        --up:#4ade80;--down:#f87171;--rule:#242220}
  *{margin:0;padding:0;box-sizing:border-box}
  body{background:var(--bg);color:var(--ink);font-family:'Inter',system-ui,sans-serif;
    -webkit-font-smoothing:antialiased;line-height:1.55;font-size:15px}
  .wrap{max-width:960px;margin:0 auto;padding:64px 32px 96px}
  a{color:var(--muted);text-decoration:none}
  a:hover{color:var(--ink)}

  h1{font-size:clamp(1.5rem,2.4vw,1.85rem);font-weight:600;letter-spacing:-.02em;
    line-height:1.35;max-width:46ch}
  .sub{margin-top:14px;color:var(--muted);max-width:62ch}
  .meta{margin-top:16px;font-family:'JetBrains Mono',monospace;font-size:11.5px;
    color:var(--faint)}

  .notice{margin:36px 0 44px;padding:18px 20px;border-radius:12px;
    background:#131210;border:1px solid var(--rule);color:var(--muted);
    font-size:14px;max-width:70ch}
  .notice b{color:var(--ink);font-weight:600}
  .notice code{font-family:'JetBrains Mono',monospace;font-size:12.5px;color:#c9c4ba}

  h2{font-size:11.5px;font-weight:500;letter-spacing:.14em;text-transform:uppercase;
    color:var(--muted);margin:52px 0 20px}

  table{width:100%;border-collapse:collapse;font-size:13.5px}
  th{text-align:left;font-weight:500;font-size:11px;letter-spacing:.1em;
    text-transform:uppercase;color:var(--faint);padding:0 12px 10px 0;
    border-bottom:1px solid var(--rule)}
  th.num,td.num{text-align:right;font-family:'JetBrains Mono',monospace;
    font-variant-numeric:tabular-nums}
  td{padding:9px 12px 9px 0;border-bottom:1px solid #1a1815}
  td.name{font-weight:500}
  .delta.pos{color:var(--up)}
  .delta.neg{color:var(--down)}
  .delta.flat{color:var(--faint)}
  .muted{color:var(--faint)}

  footer{margin-top:64px;padding-top:24px;border-top:1px solid var(--rule);
    font-size:12.5px;color:var(--faint);display:flex;gap:18px;flex-wrap:wrap}
</style>
</head>
<body>
<div class="wrap">
  <h1>Which skills are moving</h1>
  <p class="sub">Change in skill demand between the two most recent collection runs.
    A skill is counted when a posting mentions it; the share is of all postings in
    that snapshot.</p>
  <p class="meta" id="meta"></p>

  <div class="notice" id="notice"></div>

  <section>
    <h2>Rising</h2>
    <table id="rising"></table>
  </section>

  <section>
    <h2>Falling</h2>
    <table id="falling"></table>
  </section>

  <section>
    <h2>All skills in the latest snapshot</h2>
    <table id="all"></table>
  </section>

  <footer>
    <a href="./index.html">← back to the dashboard</a>
    <a href="https://github.com/dutaalamin/job-market-analyzer">source</a>
  </footer>
</div>

<script>
const MIN_POSTINGS = 20;   // below this a swing is noise, not a signal

function rowsOf(csv) {
  const [head, ...body] = csv.trim().split(/\r?\n/);
  const cols = head.split(",");
  return body.filter(Boolean).map(line => {
    const cells = line.split(",");
    const row = {};
    cols.forEach((c, i) => row[c] = cells[i]);
    row.postings = Number(row.postings);
    row.pct_of_jobs = Number(row.pct_of_jobs);
    return row;
  });
}

function table(rows, withPrev) {
  if (!rows.length) return `<tbody><tr><td class="muted">no qualifying skills</td></tr></tbody>`;
  const head = withPrev
    ? `<thead><tr><th>Skill</th><th class="num">Now</th><th class="num">Before</th>
         <th class="num">Change</th></tr></thead>`
    : `<thead><tr><th>Skill</th><th class="num">Postings</th>
         <th class="num">Share</th></tr></thead>`;
  const body = rows.map(r => {
    if (!withPrev) {
      return `<tr><td class="name">${r.skill}</td>
        <td class="num">${r.postings}</td>
        <td class="num muted">${r.pct_of_jobs.toFixed(1)}%</td></tr>`;
    }
    const d = r.change_pp;
    const cls = d > 0 ? "pos" : d < 0 ? "neg" : "flat";
    const sign = d > 0 ? "+" : "";
    return `<tr><td class="name">${r.skill}</td>
      <td class="num">${r.postings}</td>
      <td class="num muted">${r.prev}</td>
      <td class="num delta ${cls}">${sign}${d.toFixed(1)} pp</td></tr>`;
  }).join("");
  return head + `<tbody>${body}</tbody>`;
}

async function load() {
  const res = await fetch("./data/skill_history.csv");
  const rows = rowsOf(await res.text());

  const snapshots = [...new Set(rows.map(r => r.snapshot))].sort();
  const latest = snapshots.at(-1);
  const previous = snapshots.at(-2);

  document.getElementById("meta").textContent =
    `${snapshots.length} snapshot(s) · latest ${latest}` +
    (previous ? ` · compared with ${previous}` : "");

  const notice = document.getElementById("notice");
  if (!previous) {
    notice.innerHTML =
      `Only <b>one snapshot</b> has been recorded, so there is nothing to compare
       yet. The daily workflow adds a row per skill each run; a trend needs at
       least two. Nothing below is wrong, it is simply not a trend until the
       second day arrives.`;
  }

  const latestRows = rows.filter(r => r.snapshot === latest);
  document.getElementById("all").innerHTML = table(latestRows, false);

  if (!previous) {
    document.getElementById("rising").innerHTML = table([], true);
    document.getElementById("falling").innerHTML = table([], true);
    return;
  }

  const prevRows = new Map(
    rows.filter(r => r.snapshot === previous)
        .map(r => [r.skill, { postings: r.postings, pct: r.pct_of_jobs }])
  );

  const joined = latestRows
    .map(r => {
      const before = prevRows.get(r.skill) ?? { postings: 0, pct: 0 };
      return {
        ...r,
        prev: before.postings,
        // Percentage points, straight from the two shares in the CSV. Deriving
        // the earlier share by summing postings double-counts any posting that
        // lists two skills, so it disagreed with the file it came from.
        change_pp: r.pct_of_jobs - before.pct,
      };
    })
    .filter(r => r.postings >= MIN_POSTINGS);

  // A skill that vanished must still be reported: it is the strongest signal in
  // the table, and dropping it would hide exactly what a reader came for.
  //
  // "Vanished" means absent from the latest snapshot, not merely small. An
  // earlier version tested only whether the skill appeared in the filtered rows,
  // so a skill falling from 56 postings to 8 was reported as -100.0 pp — a lie
  // in the most alarming column on the page.
  const presentNow = new Set(latestRows.map(r => r.skill));
  const disappeared = [...prevRows.entries()]
    .filter(([skill, before]) => before.postings >= MIN_POSTINGS && !presentNow.has(skill))
    .map(([skill, before]) => ({
      skill,
      postings: 0,
      prev: before.postings,
      pct_of_jobs: 0,
      change_pp: -before.pct,
    }));

  const all = [...joined, ...disappeared];
  const rising = all.filter(r => r.change_pp > 0)
    .sort((a, b) => b.change_pp - a.change_pp).slice(0, 12);
  const falling = all.filter(r => r.change_pp < 0)
    .sort((a, b) => a.change_pp - b.change_pp).slice(0, 12);

  // Say what the numbers actually show. A previous version asserted that every
  // delta was 0.0 pp — true before the share was computed correctly, false the
  // moment it was, and printed directly above a table containing +1.4 pp.
  const biggest = [...all].sort(
    (a, b) => Math.abs(b.change_pp) - Math.abs(a.change_pp))[0];
  const sameDay = latest.slice(0, 8) === previous.slice(0, 8);
  const hidden = latestRows.filter(r => r.postings < MIN_POSTINGS).length;

  notice.innerHTML =
    `Comparing <b>${latest}</b> against <b>${previous}</b>. `
    + (sameDay
        ? `Both runs happened on the same day, so most of this is noise rather
           than trend. Read it as a preview of the shape, not a finding.`
        : `The runs are on different days, so these are real movements between
           those dates.`)
    + (biggest
        ? ` Largest move: <b>${biggest.skill} `
          + `${biggest.change_pp > 0 ? "+" : ""}${biggest.change_pp.toFixed(1)} pp</b>.`
        : "")
    + (hidden
        ? ` ${hidden} skill${hidden === 1 ? "" : "s"} below ${MIN_POSTINGS} postings
           are left out of the ranking; a swing on that few postings is not a
           signal.`
        : "");

  document.getElementById("rising").innerHTML = table(rising, true);
  document.getElementById("falling").innerHTML = table(falling, true);
}

load().catch(e => {
  document.getElementById("notice").textContent =
    "Could not load data/skill_history.csv: " + e;
});
</script>
</body>
</html>
