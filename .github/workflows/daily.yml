# Daily collection, so the dashboard can answer a question it cannot answer with
# one snapshot: which skills are moving.
#
# Why GitHub Actions and not a server: the pipeline is a short-lived batch that
# needs no state beyond the repo itself. A cron container would cost money and
# still need somewhere to keep the warehouse. Here the raw snapshots ARE the
# state, and the run is reproducible from them.

name: daily collect

on:
  schedule:
    # 06:00 Jakarta (UTC+7) == 23:00 UTC the previous day.
    - cron: "0 23 * * *"
  workflow_dispatch: {}   # so the first run can be triggered by hand

permissions:
  contents: write         # the job commits the new snapshot

concurrency:
  group: daily-collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install duckdb dbt-duckdb

      - name: Run pipeline over every snapshot
        run: python src/run.py --history

      - name: Test the transform rules
        run: python -m unittest discover -s tests -v

      - name: Commit the history row and metrics
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/skill_history.csv web/data/metrics.json
          if git diff --cached --quiet; then
            echo "nothing new today"
          else
            git commit -m "data: daily snapshot $(date -u +%Y-%m-%d)"
            git push
          fi
